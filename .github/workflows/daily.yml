name: 峨眉山天气长图

on:
  schedule:
    # UTC 23:00 = 北京时间次日 07:00
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 中文字体：直接下载 Noto CJK，避免 apt-get update 偶发卡死（曾拖到 20 分钟超时）。
      # 用缓存命中后几乎零耗时。
      - name: 缓存中文字体
        uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts
          key: noto-cjk-sc-v1

      - name: 准备中文字体
        timeout-minutes: 6
        run: |
          FONT_DIR="$HOME/.local/share/fonts"
          mkdir -p "$FONT_DIR"
          BASE="https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese"
          for f in NotoSansCJKsc-Regular.otf NotoSansCJKsc-Bold.otf; do
            if [ ! -s "$FONT_DIR/$f" ]; then
              echo "下载 $f ..."
              curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 240 \
                -o "$FONT_DIR/$f.part" "$BASE/$f"
              mv "$FONT_DIR/$f.part" "$FONT_DIR/$f"
            else
              echo "$f 已存在，跳过"
            fi
          done
          ls -lh "$FONT_DIR"
          fc-cache -f > /dev/null 2>&1 || true
          COUNT=$(fc-list | grep -ci "Noto Sans CJK" || true)
          echo "Noto CJK 字体条目: $COUNT"
          [ "$COUNT" -ge 1 ] || { echo "中文字体安装失败"; exit 1; }

      - name: 安装依赖
        timeout-minutes: 12
        run: |
          python -m pip install -q --upgrade pip
          pip install -q playwright pillow
          python -m playwright install --with-deps chromium

      - name: 生成天气图
        env:
          CARD_PROJECT: ${{ github.workspace }}/web
          CARD_OUT: ${{ github.workspace }}/out
          CARD_PORT: "8080"
        run: |
          python card/make_card.py
          find out -name "emei-*.jpg" -mtime +30 -delete

      - name: 提交到仓库
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add -A out web/.obs-lastgood.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "天气图 $(date +%F)"
            git push
          fi

      - name: 微信推送
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          CARD_OUT: ${{ github.workspace }}/out
        run: python card/push.py
